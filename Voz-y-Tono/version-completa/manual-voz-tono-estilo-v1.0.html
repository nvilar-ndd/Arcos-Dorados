    "glosario": {
      "title": "Glosario",
      "category": "intro",
      "alts": [
        "glosario",
        "definiciones",
        "conceptos"
      ],
      "blocks": [
        {
          "type": "heading",
          "level": 3,
          "text": "Accesibilidad"
        },
        {
          "type": "paragraph",
          "text": "Condición que permite que más personas comprendan y usen una experiencia, incluidas aquellas con discapacidades o limitaciones permanentes, temporales o contextuales."
        },
        {
          "type": "heading",
          "level": 3,
          "text": "Bloqueo"
        },
        {
          "type": "paragraph",
          "text": "Situación en la que la persona no puede continuar una tarea hasta resolver una condición o recibir una alternativa."
        },
        {
          "type": "heading",
          "level": 3,
          "text": "Carga cognitiva"
        },
        {
          "type": "paragraph",
          "text": "Esfuerzo mental necesario para comprender información, recordar opciones y completar una tarea."
        },
        {
          "type": "heading",
          "level": 3,
          "text": "Claridad"
        },
        {
          "type": "paragraph",
          "text": "Cualidad que permite comprender la información y actuar sin esfuerzo innecesario, sin perder precisión."
        },
        {
          "type": "heading",
          "level": 3,
          "text": "Contenido UX"
        },
        {
          "type": "paragraph",
          "text": "Contenido que forma parte de una experiencia de producto y ayuda a comprender, decidir, actuar o continuar una tarea."
        },
        {
          "type": "heading",
          "level": 3,
          "text": "Contexto de UX"
        },
        {
          "type": "paragraph",
          "text": "Situación recurrente de la experiencia que reúne una necesidad comunicacional y un objetivo de contenido, como una confirmación, una espera, una promoción, un error o un bloqueo."
        },
        {
          "type": "heading",
          "level": 3,
          "text": "CTA"
        },
        {
          "type": "paragraph",
          "text": "Texto de una acción que indica qué puede hacer la persona y anticipa el resultado de activarla."
        },
        {
          "type": "heading",
          "level": 3,
          "text": "Error"
        },
        {
          "type": "paragraph",
          "text": "Situación en la que una acción no se completa como se esperaba o requiere una corrección."
        },
        {
          "type": "heading",
          "level": 3,
          "text": "Español neutral"
        },
        {
          "type": "paragraph",
          "text": "Versión fuente en español pensada para ser clara y comprensible en los distintos mercados de la región. Usa `tú` como tratamiento base."
        },
        {
          "type": "heading",
          "level": 3,
          "text": "Inclusión"
        },
        {
          "type": "paragraph",
          "text": "Criterio que busca evitar exclusiones, estereotipos y presuposiciones innecesarias al representar, describir o dirigirse a las personas."
        },
        {
          "type": "heading",
          "level": 3,
          "text": "Localización"
        },
        {
          "type": "paragraph",
          "text": "Adaptación de un contenido a las convenciones lingüísticas, culturales, terminológicas y de formato del mercado donde se utilizará."
        },
        {
          "type": "heading",
          "level": 3,
          "text": "Mercado"
        },
        {
          "type": "paragraph",
          "text": "Ámbito geográfico o comercial para el que se publica una experiencia y en el que pueden aplicarse convenciones o nomenclaturas específicas."
        },
        {
          "type": "heading",
          "level": 3,
          "text": "Modalidad"
        },
        {
          "type": "paragraph",
          "text": "Forma mediante la cual una persona recibe información o interactúa con la experiencia, por ejemplo texto, voz, pantalla o sonido."
        },
        {
          "type": "heading",
          "level": 3,
          "text": "Próximo paso"
        },
        {
          "type": "paragraph",
          "text": "Acción disponible o resultado esperado que permite saber cómo continuar."
        },
        {
          "type": "heading",
          "level": 3,
          "text": "Riesgo"
        },
        {
          "type": "paragraph",
          "text": "Posibilidad de que una situación produzca consecuencias negativas para la persona, sus datos, su dinero, su confianza o su capacidad de continuar."
        },
        {
          "type": "heading",
          "level": 3,
          "text": "Tono"
        },
        {
          "type": "paragraph",
          "text": "Forma en que la Voz UX se adapta a una situación concreta sin cambiar la identidad de la marca."
        },
        {
          "type": "heading",
          "level": 3,
          "text": "Traducción"
        },
        {
          "type": "paragraph",
          "text": "Conversión de un contenido de un idioma a otro. No equivale por sí sola a localización."
        },
        {
          "type": "heading",
          "level": 3,
          "text": "Variante o adaptación local"
        },
        {
          "type": "paragraph",
          "text": "Cambio validado de una regla, término, formulación o formato para un mercado o idioma específico."
        },
        {
          "type": "heading",
          "level": 3,
          "text": "Voz hablada del asistente"
        },
        {
          "type": "paragraph",
          "text": "Forma en que la identidad verbal se convierte en una experiencia conversacional y sonora."
        },
        {
          "type": "heading",
          "level": 3,
          "text": "Voz UX"
        },
        {
          "type": "paragraph",
          "text": "Manera reconocible en que la marca se expresa en sus experiencias digitales mediante las palabras, el orden de la información y la forma de orientar a las personas."
        },
        {
          "type": "heading",
          "level": 3,
          "text": "Voseo rioplatense"
        },
        {
          "type": "paragraph",
          "text": "Tratamiento con `vos` utilizado como adaptación posterior en Argentina y Uruguay. La versión fuente se redacta siempre en español neutral con `tú`."
        }
      ]
    },
    "voz-hablada-asistente": {
      "title": "Voz hablada del asistente",
      "category": "voz-hablada",
      "alts": [
        "voz hablada",
        "asistente",
        "IA conversacional",
        "persona vocal"
      ],
      "blocks": [
        {
          "type": "paragraph",
          "text": "La voz hablada del asistente convierte la identidad verbal de la marca en una experiencia conversacional y sonora. Hereda la Voz UX y adapta el tono según el contexto, pero requiere decisiones específicas de oralidad, turnos, pronunciación y realización vocal."
        },
        {
          "type": "heading",
          "level": 2,
          "text": "Qué debe conservar"
        },
        {
          "type": "paragraph",
          "text": "La personalidad vocal hereda los fundamentos de [[page:voz-ux|Voz UX]] y aplica la jerarquía de [[page:tono|Tono]]. La claridad tiene prioridad sobre la expresividad. Las variaciones contextuales conservan una misma personalidad."
        }
      ],
      "related": [
        "voz-ux",
        "tono"
      ]
    },
    "escritura-escuchada": {
      "title": "Escritura para ser escuchada",
      "category": "voz-hablada",
      "alts": [
        "escuchado",
        "turno",
        "lenguaje hablado",
        "oralidad"
      ],
      "blocks": [
        {
          "type": "heading",
          "level": 2,
          "text": "Mantén cada turno enfocado"
        },
        {
          "type": "paragraph",
          "text": "Comunica una idea principal o solicita una acción por vez. Si necesitas ofrecer varias opciones, presenta solo las necesarias para decidir y ordénalas de forma fácil de recordar."
        },
        {
          "type": "heading",
          "level": 2,
          "text": "Haz una pregunta y cede el turno"
        },
        {
          "type": "paragraph",
          "text": "Cuando el asistente formule una pregunta, debe permitir que la persona responda. No agregues después información nueva que compita con la acción solicitada."
        },
        {
          "type": "heading",
          "level": 2,
          "text": "Usa lenguaje directo y cotidiano"
        },
        {
          "type": "paragraph",
          "text": "Prefiere frases breves, palabras conocidas y construcciones naturales al hablar. Evita introducciones innecesarias y lenguaje técnico."
        },
        {
          "type": "heading",
          "level": 2,
          "text": "Lleva al frente la información necesaria"
        },
        {
          "type": "paragraph",
          "text": "En el canal hablado, la información principal no debe quedar escondida al final. Explica primero qué ocurrió, qué necesita decidir la persona o qué acción está disponible."
        },
        {
          "type": "heading",
          "level": 2,
          "text": "Adapta la información al turno"
        },
        {
          "type": "paragraph",
          "text": "Prioriza lo necesario para ese turno, evita enumeraciones largas y divide la información cuando ayude a comprender o decidir."
        }
      ],
      "related": [
        "voz-hablada-asistente",
        "recuperacion-conversacional"
      ]
    },
    "recuperacion-conversacional": {
      "title": "Recuperación conversacional",
      "category": "voz-hablada",
      "alts": [
        "recuperación conversacional",
        "reformular",
        "intervención"
      ],
      "blocks": [
        {
          "type": "paragraph",
          "text": "Cuando una intervención no funciona, no repitas mecánicamente el mismo contenido."
        },
        {
          "type": "unorderedList",
          "items": [
            "Reformula;",
            "Reduce la cantidad de opciones;",
            "Divide una lista;",
            "Aclara un término;",
            "Cambia el orden de la información;",
            "Ofrece una alternativa real cuando exista."
          ]
        },
        {
          "type": "paragraph",
          "text": "No simules comprensión ni confirmes información que el sistema no reconoció."
        }
      ],
      "related": [
        "escritura-escuchada",
        "multimodalidad-voz"
      ]
    },
    "multimodalidad-voz": {
      "title": "Multimodalidad en voz y pantalla",
      "category": "voz-hablada",
      "alts": [
        "multimodalidad",
        "voz y pantalla",
        "accesibilidad multimodal"
      ],
      "blocks": [
        {
          "type": "paragraph",
          "text": "Mantén continuidad entre voz y pantalla cuando ambas estén disponibles. Si el asistente muestra opciones, detalles o confirmaciones visuales, la conversación debe referirse a esa información de forma natural y permitir continuar sin repetirla innecesariamente ni contradecirla."
        },
        {
          "type": "paragraph",
          "text": "Conserva intención, terminología y significado entre modalidades. No obligues a depender de una sola cuando la experiencia ofrece ambas. Considera alternativas para quienes no puedan escuchar, hablar o usar una pantalla cuando corresponda."
        }
      ],
      "related": [
        "recuperacion-conversacional"
      ]
    },
    "pronunciacion": {
      "title": "Pronunciación",
      "category": "voz-hablada",
      "alts": [
        "pronunciación",
        "nombres de productos",
        "fechas y horas",
        "monedas"
      ],
      "blocks": [
        {
          "type": "paragraph",
          "text": "Evalúa la pronunciación con términos y datos reales de la experiencia:"
        },
        {
          "type": "unorderedList",
          "items": [
            "nombres de productos, programas y secciones, incluidas `Mi cuenta` y `Mis pedidos`;",
            "números, cantidades y códigos;",
            "fechas y horas;",
            "monedas y precios;",
            "direcciones;",
            "términos localizados;",
            "nombres propios cuando corresponda."
          ]
        },
        {
          "type": "paragraph",
          "text": "Una pronunciación correcta no debe inferirse solo de la grafía."
        }
      ],
      "related": [
        "evaluacion-voz",
        "datos-mercado"
      ]
    },
    "evaluacion-voz": {
      "title": "Evaluación y selección de una voz",
      "category": "voz-hablada",
      "alts": [
        "evaluación vocal",
        "seleccionar voz",
        "género percibido",
        "edad percibida",
        "velocidad",
        "pausas",
        "entonación",
        "prosodia",
        "energía",
        "timbre"
      ],
      "blocks": [
        {
          "type": "heading",
          "level": 2,
          "text": "Dimensiones obligatorias de evaluación vocal"
        },
        {
          "type": "paragraph",
          "text": "Estas dimensiones deben evaluarse al seleccionar o configurar una voz, pero el Manual no fija valores universales. Los valores concretos requieren pruebas perceptuales y técnicas con voces candidatas."
        },
        {
          "type": "heading",
          "level": 3,
          "text": "Género percibido"
        },
        {
          "type": "paragraph",
          "text": "No se prescribe un género. Evalúa qué asociaciones genera cada voz y si son compatibles con el perfil buscado. El género no debe usarse como atajo para representar cercanía, autoridad o calidez."
        },
        {
          "type": "heading",
          "level": 3,
          "text": "Edad percibida"
        },
        {
          "type": "paragraph",
          "text": "No se fija un rango ni se usa la edad como atajo de cercanía, autoridad o calidez. Evalúa si la percepción resultante introduce asociaciones no deseadas o afecta claridad, cercanía o confianza."
        },
        {
          "type": "heading",
          "level": 3,
          "text": "Velocidad"
        },
        {
          "type": "paragraph",
          "text": "Debe favorecer comprensión y procesamiento auditivo. Determínala mediante pruebas, no mediante un valor universal."
        },
        {
          "type": "heading",
          "level": 3,
          "text": "Pausas"
        },
        {
          "type": "paragraph",
          "text": "Deben apoyar estructura, turnos, opciones y comprensión. Valídalas escuchando diálogos completos."
        },
        {
          "type": "heading",
          "level": 3,
          "text": "Entonación y prosodia"
        },
        {
          "type": "paragraph",
          "text": "Deben permitir distinguir intención y contexto sin exageración ni artificio."
        },
        {
          "type": "heading",
          "level": 3,
          "text": "Energía"
        },
        {
          "type": "paragraph",
          "text": "Puede variar según la situación. Redúcela ante riesgo, errores, pagos, demoras o incertidumbre."
        },
        {
          "type": "heading",
          "level": 3,
          "text": "Altura tonal"
        },
        {
          "type": "paragraph",
          "text": "Evalúala como parte de la percepción global de la voz, no como un atributo de marca aislado."
        },
        {
          "type": "heading",
          "level": 3,
          "text": "Volumen y timbre"
        },
        {
          "type": "paragraph",
          "text": "Deben sostener claridad, naturalidad y consistencia con la tecnología utilizada."
        },
        {
          "type": "heading",
          "level": 3,
          "text": "Pronunciación"
        },
        {
          "type": "paragraph",
          "text": "Valida el reconocimiento de nombres y datos con la voz y la tecnología previstas, según los criterios de Pronunciación."
        },
        {
          "type": "heading",
          "level": 3,
          "text": "Variación contextual"
        },
        {
          "type": "paragraph",
          "text": "Evalúa ritmo, pausas, entonación y energía en diálogos reales de distintos contextos, conservando una misma personalidad."
        },
        {
          "type": "heading",
          "level": 2,
          "text": "Cómo seleccionar una voz"
        },
        {
          "type": "paragraph",
          "text": "Define primero el perfil y luego compara voces candidatas con el mismo conjunto de diálogos representativos."
        },
        {
          "type": "paragraph",
          "text": "Evalúa, como mínimo:"
        },
        {
          "type": "unorderedList",
          "items": [
            "claridad y naturalidad;",
            "adaptación contextual sin cambio de personalidad;",
            "pronunciación;",
            "consistencia en intervenciones breves y extensas;",
            "percepción social de la voz;",
            "comportamiento con la tecnología y los idiomas previstos."
          ]
        },
        {
          "type": "paragraph",
          "text": "No elijas una voz solo por una demostración aislada, una etiqueta comercial o una preferencia estética."
        },
        {
          "type": "paragraph",
          "text": "No copies parámetros de otras marcas ni los fijes por intuición. Prueba las voces con la tecnología y los idiomas previstos antes de elegir valores concretos."
        },
        {
          "type": "paragraph",
          "text": "Para adaptar tratamiento, terminología y convenciones, consulta [[page:fuente-neutral|Español regional y localización]] y [[page:equivalencias|Equivalencias]]."
        }
      ],
      "related": [
        "pronunciacion",
        "voz-hablada-asistente",
        "fuente-neutral"
      ]
    },

    "problemas-recuperacion": {
      "title": "Problemas y recuperación",
      "category": "contextos",
      "alts": [
        "recuperación",
        "problema",
        "problemas",
        "próximo paso",
        "especificidad útil",
        "error",
        "errores",
        "bloqueo",
        "bloqueos",
        "mensaje de error",
        "algo salió mal",
        "cómo escribir un error",
        "Errores y bloqueos",
        "Comunicación ante problemas y recuperación"
      ],
      "blocks": [
        {
          "type": "paragraph",
          "text": "Su objetivo es ayudar a comprender un problema, sus consecuencias y cómo continuar. Reúne criterios para errores, bloqueos, demoras problemáticas, pagos y pérdida de información."
        },
        {
          "type": "heading",
          "level": 2,
          "text": "Explica qué ocurrió y qué impacto tiene"
        },
        {
          "type": "paragraph",
          "text": "Describe el problema sin culpar a la persona. Evita mensajes genéricos cuando exista información suficiente para explicar el caso. Comunica qué ocurrió con la mayor especificidad útil y aclara el impacto cuando no sea evidente."
        },
        {
          "type": "paragraph",
          "text": "Incluye solo lo necesario para comprender y actuar. Si conoces el problema o la salida, comunícalos sin agrupar casos distintos que obliguen a la persona a descubrir qué indicación le corresponde."
        },
        {
          "type": "example",
          "avoid": {
            "label": "Evita",
            "items": [
              "`Algo salió mal` como respuesta suficiente cuando el sistema dispone de información más específica."
            ]
          },
          "better": {
            "label": "Mejor",
            "items": [
              "explicar qué ocurrió y qué puede hacer la persona a continuación."
            ]
          }
        },
        {
          "type": "heading",
          "level": 2,
          "text": "Ofrece una salida según quién puede resolverlo"
        },
        {
          "type": "paragraph",
          "text": "Orienta hacia una salida real. Si la persona puede resolver el error, indica qué necesita corregir o hacer para continuar. Si la solución no depende de ella, explica cómo puede seguir sin sugerir que está en sus manos corregir el problema."
        },
        {
          "type": "paragraph",
          "text": "Si no hay una salida inmediata, comunica la información disponible sin inventar acciones, información ni funciones."
        },
        {
          "type": "heading",
          "level": 2,
          "text": "Comunica expectativas que puedan sostenerse"
        },
        {
          "type": "paragraph",
          "text": "Comunica plazos concretos o expectativas que puedan sostenerse cuando esa información esté disponible. No inventes tiempos ni resultados. Para el estado de un proceso en curso o una espera, consulta [[page:esperas|Esperas y demoras]]."
        },
        {
          "type": "heading",
          "level": 2,
          "text": "Distingue información relevante de procesos internos"
        },
        {
          "type": "paragraph",
          "text": "Omite procesos internos, responsables, etapas operativas o detalles técnicos que no ayuden a comprender qué ocurrirá o qué debe hacer la persona. Esto no permite ocultar responsabilidades, causas, cambios de plazo ni consecuencias relevantes. Comunica resultado, próximo paso y previsibilidad, sin inventar información o funciones."
        },
        {
          "type": "heading",
          "level": 2,
          "text": "Reconoce la responsabilidad de la organización"
        },
        {
          "type": "paragraph",
          "text": "La responsabilidad funciona como una condición específica, no como un eje principal del modelo de tono. Cuando una consecuencia negativa sea responsabilidad de la organización, evalúa si corresponde reconocerlo, disculparse de forma breve, explicar qué hará la organización e indicar un plazo o expectativa que pueda sostenerse. No uses disculpas automáticas ante cualquier resultado negativo."
        },
        {
          "type": "heading",
          "level": 2,
          "text": "Ajusta la expresividad en situaciones sensibles"
        },
        {
          "type": "paragraph",
          "text": "En errores, bloqueos, demoras, pagos o pérdida de información, prioriza precisión, transparencia y próximos pasos inequívocos que ofrezcan una salida real. Reduce la expresividad, la presión comercial, el humor y la ligereza. Una situación sensible puede seguir siendo cálida sin dejar de ser precisa y sobria. No atribuyas emociones que no puedas verificar. Aplica el modelo de [[page:tono|Tono]] sin redefinirlo en este contexto."
        }
      ],
      "related": [
        "tono",
        "cta",
        "comprension",
        "emojis",
        "esperas"
      ]
    },
    "exploracion-eleccion": {
      "title": "Exploración y elección",
      "category": "contextos",
      "alts": [],
      "blocks": [
        {
          "type": "paragraph",
          "text": "Cuando una persona explora una funcionalidad, un beneficio o varias alternativas, ayúdala a comprender qué se ofrece, reconocer las diferencias relevantes y decidir cómo continuar."
        },
        {
          "type": "heading",
          "level": 2,
          "text": "Facilita comprender y decidir"
        },
        {
          "type": "paragraph",
          "text": "Presenta primero lo necesario para entender qué puede hacer la persona, qué obtiene o qué cambia entre las alternativas."
        },
        {
          "type": "unorderedList",
          "items": [
            "Muestra la información relevante para la decisión actual.",
            "Conserva las condiciones o consecuencias que puedan cambiar la elección.",
            "No presupongas que el nombre de una funcionalidad o beneficio explica por sí solo para qué sirve.",
            "Cuando presentes una funcionalidad nueva o poco conocida, explica qué permite hacer o por qué puede resultar relevante antes de agregar detalles secundarios.",
            "Evita acumular mensajes o beneficios que compitan con la decisión principal."
          ]
        },
        {
          "type": "paragraph",
          "text": "La exploración puede admitir cercanía y energía moderada, pero ajusta la expresividad a la importancia de la decisión. No uses entusiasmo, urgencia o presión para desplazar información necesaria para elegir."
        },
        {
          "type": "heading",
          "level": 2,
          "text": "Presenta y compara opciones con foco"
        },
        {
          "type": "paragraph",
          "text": "Cuando haya varias alternativas, usa denominaciones consistentes y facilita reconocer qué las diferencia."
        },
        {
          "type": "paragraph",
          "text": "Prioriza las diferencias que ayudan a decidir. La información secundaria puede quedar disponible como detalle adicional cuando no sea necesaria para comparar las opciones inicialmente."
        },
        {
          "type": "paragraph",
          "text": "No agregues atributos solo para que todas las alternativas parezcan tener la misma cantidad de información ni cambies de término para nombrar el mismo concepto."
        }
      ],
      "related": [
        "tono",
        "titulos-bajadas",
        "comprension",
        "cta",
        "promociones"
      ]
    },
    "ayuda-soporte": {
      "title": "Ayuda y soporte",
      "category": "contextos",
      "alts": [],
      "blocks": [
        {
          "type": "paragraph",
          "text": "El contenido de ayuda debe permitir reconocer rápidamente si responde a una duda o tarea y ofrecer la orientación necesaria para continuar."
        },
        {
          "type": "heading",
          "level": 2,
          "text": "Orienta hacia la necesidad o tarea"
        },
        {
          "type": "paragraph",
          "text": "Organiza el contenido alrededor de lo que la persona necesita comprender o hacer, no de cómo está organizado internamente el producto."
        },
        {
          "type": "paragraph",
          "text": "El título debe permitir reconocer rápidamente qué necesidad, duda o tarea resuelve el contenido. Usa los mismos términos que aparecen en la experiencia y evita nombres internos o formulaciones genéricas que obliguen a interpretar de qué trata la ayuda."
        },
        {
          "type": "paragraph",
          "text": "Mantén cada contenido enfocado en una necesidad principal. Si reúne información distinta, organízala para que cada parte pueda identificarse y recorrerse con facilidad."
        },
        {
          "type": "heading",
          "level": 2,
          "text": "Da la información necesaria para resolverla"
        },
        {
          "type": "paragraph",
          "text": "Ve directo a la orientación útil para la tarea. Incluye requisitos, condiciones o resultados esperados cuando sean necesarios para aplicarla correctamente."
        },
        {
          "type": "paragraph",
          "text": "Cuando incluyas enlaces para obtener ayuda, detalles o más información, deja claro qué información encontrará la persona allí."
        },
        {
          "type": "heading",
          "level": 2,
          "text": "Ofrece ayuda en el momento adecuado"
        },
        {
          "type": "paragraph",
          "text": "Cuando una duda pueda resolverse con una orientación breve dentro de la tarea, evita obligar a la persona a abandonarla para buscar la respuesta en otro lugar."
        },
        {
          "type": "paragraph",
          "text": "Si la explicación necesaria es más extensa o corresponde a otra necesidad, ofrece acceso al contenido adicional sin sobrecargar el momento actual."
        }
      ],
      "related": [
        "tono",
        "titulos-bajadas",
        "comprension",
        "etiquetas-enlaces"
      ]
    }
  },
  "aliases": {
    "monedas-precios": "separadores",
    "negritas": "parrafos-breves",
    "presuposiciones": "genero",
    "terminos-respetuosos": "genero",
    "crear-adaptacion": "fuente-neutral",
    "localizar": "fuente-neutral",
    "relacion-glosario": "fuente-neutral",
    "errores": "problemas-recuperacion",
    "recuperacion": "problemas-recuperacion"
  },
  "statePage": {
    "title": "Estado y cambios",
    "categoryLabel": "Manual v1.0",
    "alts": [],
    "blocks": [
      {
        "type": "lede",
        "text": "Este Manual evoluciona junto con las necesidades de las experiencias digitales. El versionado permite saber cuándo un cambio modifica una pauta y qué versión debe utilizarse como referencia."
      },
      {
        "type": "heading",
        "level": 2,
        "text": "Esta versión publicada"
      },
      {
        "type": "paragraph",
        "text": "**Versión:** v1.0."
      },
      {
        "type": "paragraph",
        "text": "**Estado:** Vigente."
      },
      {
        "type": "paragraph",
        "text": "**Fecha de publicación:** 15 de octubre de 2026."
      }
    ]
  }
}
</script>
<script>
const contentData=JSON.parse(document.getElementById('manualContentData').textContent);
const categories=contentData.categories;
const pages=contentData.pages;
const statePage=contentData.statePage;
const aliases=contentData.aliases||{};
function canonicalId(id){return aliases[id]||id}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function navHTML(mobile=false){
  const groups=categories.map(c=>{
    if(c.direct) return `<a class="nav-category-toggle" data-route="${esc(c.direct)}" href="#/p/${c.direct}">${esc(c.name)}</a>`;
    return `<div class="nav-category" data-category="${c.id}"><button class="nav-category-toggle" type="button" aria-expanded="false"><span>${esc(c.name)}</span><span class="chevron" aria-hidden="true">›</span></button><div class="nav-subtopics">${c.topics.length?c.topics.map(id=>`<a data-route="${id}" href="#/p/${id}">${esc(pages[id].title)}</a>`).join(''):`<button class="disabled" disabled aria-disabled="true">Sin contenido en esta muestra</button>`}</div></div>`;
  }).join('');
  return `${mobile?`<div class="mobile-search"><label class="label" for="mobileSearch">Buscar</label><input id="mobileSearch" type="search" placeholder="Ej. Puntuación" autocomplete="off"></div>`:''}${groups}`;
}
document.getElementById('desktopNav').innerHTML=navHTML();
function bindNavToggles(root=document){
  root.querySelectorAll('.nav-category > .nav-category-toggle').forEach(btn=>btn.addEventListener('click',()=>{
    const group=btn.closest('.nav-category'); const open=!group.classList.contains('open');
    group.classList.toggle('open',open); btn.setAttribute('aria-expanded',String(open));
  }));
}
bindNavToggles(document);
function categoryName(p){
  if(p.categoryLabel)return p.categoryLabel;
  const c=categories.find(x=>x.id===p.category);
  return c?c.name:'';
}
function inline(text=''){
  let out=esc(text);
  out=out.replace(/\[\[page:([^|\]]+)\|([^\]]+)\]\]/g,(_,id,label)=>`<a href="#/p/${id}">${label}</a>`);
  out=out.replace(/`([^`]+)`/g,'$1');
  out=out.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  return out;
}
function renderBlock(b){
  if(!b||!b.type)return '';
  if(b.type==='lede')return `<p class="lede">${inline(b.text)}</p>`;
  if(b.type==='paragraph')return `<p>${inline(b.text)}</p>`;
  if(b.type==='heading'){const level=[2,3,4].includes(b.level)?b.level:2;return `<h${level}>${inline(b.text)}</h${level}>`}
  if(b.type==='unorderedList'||b.type==='orderedList'){
    const tag=b.type==='orderedList'?'ol':'ul';
    return `<${tag}>${(b.items||[]).map(x=>`<li>${inline(x)}</li>`).join('')}</${tag}>`;
  }
  if(b.type==='rule'){
    const genericLabels=new Set(['Objetivo','Regla']);
    const label=b.label&&!genericLabels.has(b.label)?`<p><strong>${inline(b.label)}</strong></p>`:'';
    const text=b.text?`<p>${inline(b.text)}</p>`:'';
    const children=(b.children||[]).map(renderBlock).join('');
    return `<div class="rule">${label}${text}${children}</div>`;
  }
  if(b.type==='example'){
    const side=(obj,cls,def)=>{if(!obj)return '';const vals=obj.items||((obj.text||'')?[obj.text]:[]);return `<div class="${cls}"><span class="label">${inline(obj.label||def)}</span>${vals.length>1?`<ul>${vals.map(x=>`<li>${inline(x)}</li>`).join('')}</ul>`:vals.map(x=>`<div>${inline(x)}</div>`).join('')}</div>`};
    return `<div class="example">${side(b.avoid,'avoid','Evita')}${side(b.better,'better','Mejor')}</div>`;
  }
  if(b.type==='table')return `<div class="table-wrap" role="region" aria-label="Tabla de ${esc(b.headers?.[0]||'datos')}" tabindex="0"><table class="content-table"><thead><tr>${(b.headers||[]).map(h=>`<th scope="col">${inline(h)}</th>`).join('')}</tr></thead><tbody>${(b.rows||[]).map((r,i)=>`<tr>${r.map((c,j)=>{if(b.mergeFirstColumn&&j===0){if(c==='')return '';let span=1;while(i+span<b.rows.length&&b.rows[i+span][0]==='')span++;return `<td rowspan="${span}">${inline(c)}</td>`}return `<td>${inline(c)}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`;
  if(b.type==='callout')return `<p class="callout">${b.label?`<strong>${inline(b.label)}</strong> `:''}${inline(b.text||'')}</p>`;
  if(b.type==='status')return `<span class="status">${inline(b.text)}</span>`;
  return '';
}
function renderBlocks(blocks=[]){return blocks.map(renderBlock).join('')}
function plainText(p){
  const parts=[];
  const walk=b=>{
    if(!b)return;
    if(b.text)parts.push(b.text.replace(/\[\[page:[^|\]]+\|([^\]]+)\]\]/g,'$1').replace(/\*\*/g,'').replace(/`/g,''));
    if(b.label)parts.push(b.label);
    (b.items||[]).forEach(x=>parts.push(x.replace(/\*\*/g,'').replace(/`/g,'')));
    if(b.better){parts.push(b.better.label||'');(b.better.items||[b.better.text||'']).forEach(x=>parts.push(x))}
    if(b.avoid){parts.push(b.avoid.label||'');(b.avoid.items||[b.avoid.text||'']).forEach(x=>parts.push(x))}
    (b.headers||[]).forEach(x=>parts.push(x));(b.rows||[]).forEach(r=>r.forEach(x=>parts.push(x)));
    (b.children||[]).forEach(walk);
  };
  (p.blocks||[]).forEach(walk);
  return parts.join(' ');
}
function footerHTML(){return `<footer class="footer-note"><a data-route="estado" href="#/estado">Estado y cambios</a></footer>`}
function pageShell(p,id){let rel=p.related?.length?`<section class="related"><h2>Contenido relacionado</h2><div class="related-links">${p.related.map(rid=>`<a class="pill" href="#/p/${rid}">${esc(pages[rid]?.title||rid)}</a>`).join('')}</div></section>`:'';return `<article class="page" data-page="${esc(id)}"><h1>${esc(p.title)}</h1>${renderBlocks(p.blocks)}${rel}</article>${footerHTML()}`}
function normalize(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function search(q){let nq=normalize(q.trim());if(!nq)return [];return Object.entries(pages).map(([id,p])=>{let hay=normalize([p.title,categoryName(p),...p.alts,plainText(p)].join(' '));let score=0;if(normalize(p.title)===nq)score+=100;if(normalize(p.title).includes(nq))score+=40;if(p.alts.some(a=>normalize(a)===nq))score+=70;if(p.alts.some(a=>normalize(a).includes(nq)||nq.includes(normalize(a))))score+=25;if(hay.includes(nq))score+=10;return {id,p,score}}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score)}
function renderSearch(q){let r=search(q),safe=esc(q);if(!q.trim())return `<section class="search-panel"><span class="eyebrow">Búsqueda</span><h1>Busca en el Manual</h1><form class="search-box" id="searchForm"><input id="searchInput" type="search" aria-label="Buscar" placeholder="Ej. Puntuación"><button>Buscar</button></form><div class="empty">Escribe una consulta para buscar en los contenidos publicados de esta muestra.</div></section>`;return `<section class="search-panel"><span class="eyebrow">Búsqueda</span><h1>Resultados para “${safe}”</h1><form class="search-box" id="searchForm"><input id="searchInput" type="search" value="${safe}" aria-label="Buscar"><button>Buscar</button></form>${r.length?`<div class="result-count">${r.length} resultado${r.length===1?'':'s'}</div>${r.map(x=>`<a class="result" href="#/p/${x.id}"><span class="label">${esc(categoryName(x.p))}</span><h2>${esc(x.p.title)}</h2><p>${esc((plainText(x.p).slice(0,180)+'…'))}</p></a>`).join('')}`:`<div class="empty"><h2>Sin resultados</h2><p>No encontramos contenido publicado para “${safe}”. Prueba con otro término o navega por las categorías.</p></div>`}</section>`}
function updateNavState(){
  const h=location.hash||'#/';
  document.querySelectorAll('[data-route]').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.nav-category').forEach(g=>{g.classList.remove('open'); const b=g.querySelector('.nav-category-toggle'); if(b)b.setAttribute('aria-expanded','false')});
  if(h==='#/'||h==='#'){document.querySelectorAll('[data-route="como-usar"]').forEach(el=>el.classList.add('active'));return}
  if(h==='#/estado'){document.querySelectorAll('[data-route="estado"]').forEach(el=>el.classList.add('active'));return}
  if(h.startsWith('#/p/')){
    const rawId=h.slice(4), id=canonicalId(rawId), p=pages[id];
    document.querySelectorAll(`[data-route="${id}"]`).forEach(el=>el.classList.add('active'));
    if(p){const c=categories.find(x=>x.id===p.category); if(c){document.querySelectorAll(`[data-category="${c.id}"]`).forEach(g=>{g.classList.add('open'); const b=g.querySelector('.nav-category-toggle'); if(b){b.classList.add('active');b.setAttribute('aria-expanded','true')}})}}
  }
}
function route(){let h=location.hash||'#/';let main=document.getElementById('main');if(h==='#/'||h==='#'){location.replace('#/p/como-usar');return}else if(h.startsWith('#/p/')){let rawId=h.slice(4),id=canonicalId(rawId),p=pages[id];if(rawId!==id){location.replace('#/p/'+id);return}main.innerHTML=p?pageShell(p,id):`<div class="empty"><h1>Contenido no disponible</h1><p>Este destino no forma parte del vertical slice.</p><a href="#/p/como-usar">Ir a Cómo usar este Manual</a></div>${footerHTML()}`}else if(h==='#/estado'){main.innerHTML=pageShell(statePage,'estado')}else if(h.startsWith('#/buscar')){let qs=new URLSearchParams(h.split('?')[1]||'');main.innerHTML=renderSearch(qs.get('q')||'')+footerHTML()}else{location.replace('#/p/como-usar');return}bind();updateNavState();main.focus();window.scrollTo(0,0)}
function goSearch(v){location.hash='#/buscar?q='+encodeURIComponent(v)}
function bind(){let hs=document.getElementById('homeSearch');if(hs)hs.addEventListener('submit',e=>{e.preventDefault();goSearch(document.getElementById('homeSearchInput').value)});let sf=document.getElementById('searchForm');if(sf)sf.addEventListener('submit',e=>{e.preventDefault();goSearch(document.getElementById('searchInput').value)})}
document.getElementById('sideSearch').addEventListener('keydown',e=>{if(e.key==='Enter')goSearch(e.currentTarget.value)});
window.addEventListener('hashchange',route);route();
</script>
</body>
</html>
